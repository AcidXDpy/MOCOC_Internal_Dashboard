name: Economic research verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh:
        description: Download new official source snapshots
        type: boolean
        default: false
  schedule:
    - cron: "0 12 * * 1"
permissions:
  contents: read
concurrency:
  group: economy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ECONOMY_DATA_DIR: ${{ runner.temp }}/economic-warehouse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: npm ci
      - run: python -m pip install -r research/requirements.txt
      - name: Rebuild and audit economic evidence
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.refresh }}" = "true" ]; then
            npm run economy:pipeline -- --refresh
          else
            npm run economy:pipeline -- --offline
          fi
      - run: npm run test:research
      - run: npm run test:warehouse
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: economic-evidence-${{ github.run_id }}
          path: |
            public/economy/
            research/data/observations.csv
            test-results/
          retention-days: 30
